    * { -webkit-tap-highlight-color: transparent; }
    /* 只鎖按鈕與畫面文字的選取，輸入框保留可選取（iOS 上全域 user-select:none 會讓輸入框難以操作） */
    body { -webkit-user-select: none; user-select: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    /* 輸入框字級 ≥16px，避免 iOS 聚焦時自動放大畫面 */
    input, select { font-size: 16px !important; }

    body {
      background-color: #1F2821;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      color: #2C221C;
    }

    /* 手機用 dvh，避免網址列遮住底部按鈕 */
    .app-shell { height: 100vh; height: 100dvh; }
    @media (min-width: 640px) { .app-shell { height: 900px; max-height: calc(100vh - 32px); } }

    /* 主舞台是可捲動的 flex 欄：子元素不可被壓縮，否則小螢幕上錢袋卡片會被擠扁裁掉 */
    main > * { flex-shrink: 0; }

    .sheet-pad-bottom { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

    .komorebi-canvas {
      background-color: #FBF8F1;
      background-image:
        radial-gradient(circle at 85% 12%, rgba(230, 166, 62, 0.45) 0%, transparent 45%),
        radial-gradient(circle at 12% 28%, rgba(127, 168, 163, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 80%, rgba(91, 130, 102, 0.22) 0%, transparent 55%),
        radial-gradient(rgba(44, 34, 28, 0.032) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 18px 18px;
    }

    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    .ghibli-tap:active { transform: scale(0.95); filter: brightness(0.96); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:disabled:active { transform: none; filter: none; }

    @keyframes cozyBreathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-1.5px) scale(1.015); }

    @keyframes leafWiggle {
      0%, 100% { transform: translate(32px, 20px) rotate(0deg); }
      25% { transform: translate(32px, 20px) rotate(4deg); }
      75% { transform: translate(32px, 20px) rotate(-3deg); }

    .leaf-wiggle { animation: leafWiggle 3s ease-in-out infinite; transform-box: view-box; }

    /* 吉祥物被點時的小跳躍 */
    @keyframes mascotHop {
      0% { transform: translateY(0); }
      35% { transform: translateY(-6px) scale(1.06); }
      70% { transform: translateY(0) scale(0.98); }
      100% { transform: translateY(0) scale(1); }
    }
    .mascot-hop { animation: mascotHop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* Toast：淡入 → 停留 → 淡出；時長由 JS 控制 */
    @keyframes floatUpFade {
      0% { opacity: 0; transform: translate(-50%, 16px) scale(0.92); }
      8% { opacity: 1; transform: translate(-50%, 0) scale(1.04); }
      12% { transform: translate(-50%, 0) scale(1); }
      88% { opacity: 1; transform: translate(-50%, -4px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -24px) scale(0.94); }

    .toast-float { animation: floatUpFade var(--toast-dur, 2.6s) cubic-bezier(0.2, 0.8, 0.25, 1) forwards; }

    @keyframes floatSeed {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0.9; }
      50% { transform: translate(4px, -12px) rotate(10deg); opacity: 0.6; }

    }
    .seed-float { animation: floatSeed 3.2s ease-out infinite; transform-box: fill-box; }


    /* 木漏れ日光斑與小樹枝 */
    .komo-dapple { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 226, 160, .75), rgba(255, 226, 160, 0)); animation: dappleBreathe 12s ease-in-out infinite; }

    .komo-leaf { animation: leafHang 4.8s ease-in-out infinite; animation-delay: var(--o, 0s); transform-box: view-box; }
    @keyframes leafHang { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }

    /* 錢袋動畫：輕輕擺動、液面晃動、光點上浮、絨毛飄走 */
    .bag-sway { animation: bagSway 5.5s ease-in-out infinite; transform-origin: 60px 40px; transform-box: view-box; }
    @keyframes bagSway { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
    .bag-wave-a { animation: waveDrift 6s ease-in-out infinite; }
    .bag-wave-b { animation: waveDrift 8s ease-in-out infinite reverse; }
    @keyframes waveDrift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-18px); } }
    .bag-mote { animation: moteRise 4.2s ease-in-out infinite; transform-box: fill-box; opacity: 0; }
    @keyframes moteRise { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: .95; } 100% { transform: translateY(-14px); opacity: 0; } }
    .bag-seed { animation: seedDrift 5s ease-out infinite; opacity: 0; }
    @keyframes seedDrift { 0% { transform: translate(0,0) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(22px,-30px) rotate(25deg); opacity: 0; } }
    .bag-sprout { animation: sproutSway 3.4s ease-in-out infinite; transform-origin: 0 0; }
    @keyframes sproutSway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    .bag-twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-origin: 60px 81px; transform-box: view-box; }
    @keyframes twinkle { 0%,100% { transform: scale(.85); opacity: .7; } 50% { transform: scale(1.1); opacity: 1; } }
    .bag-bounce { animation: bagBounce .7s cubic-bezier(.34,1.56,.64,1); transform-origin: 50% 90%; }
    @keyframes bagBounce { 0% { transform: scale(1); } 25% { transform: scale(1.06,.94); } 55% { transform: scale(.97,1.04) translateY(-3px); } 100% { transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {

      .bag-mote, .bag-seed { animation: none !important; opacity: .8; }
      .toast-float { animation-name: none; opacity: 1; transform: translate(-50%, 0); }
    }
  </style>

  <script>
    // ---------- 0. 小工具 ----------
    const $ = (id) => document.getElementById(id);

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function formatNumber(num) { return Number(num || 0).toLocaleString('zh-TW'); }
    // 只接受整數元：去掉千分位/空白/NT$；有小數點時捨去小數（避免 1000.5 被誤讀成 10005）
    function parseAmount(str) {
      const clean = String(str ?? '').replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[,，\s]/g, '').replace(/^NT\$/i, '');
      const n = Math.floor(parseFloat(clean.replace(/[^\d.]/g, '')));
      return Number.isFinite(n) && n > 0 ? Math.min(n, 999999999) : 0;
    }
    function store(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
      catch (e) { return fallback; }
    }
    function persist(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch (e) {
        if (!persist.warned) { persist.warned = true; setTimeout(() => showToast('這次沒能存進手機，請先匯出備份'), 0); }
        return false;
      }
    }

    // ---------- 1. 音效 ----------
    class GhibliSound {
      constructor() { this.ctx = null; this.muted = false; }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return false;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume(); // iOS 需要在手勢內恢復
        return true;
      }
      _arp(freqs, type, step, vol, decay) {
        if (this.muted || !this.init()) return;
        const now = this.ctx.currentTime;
        freqs.forEach((freq, i) => {
          const t = now + i * step;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(vol, t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + decay);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(t); osc.stop(t + decay + 0.05);
        });
      }
      playSave()  { this._arp([523.25, 659.25, 783.99, 1046.5], 'sine', 0.055, 0.14, 0.65); }
      playRepay() { this._arp([440, 554.37, 659.25, 880], 'triangle', 0.065, 0.12, 0.85); }
      playGoal()  { this._arp([523.25, 659.25, 783.99, 1046.5, 1318.5, 1568], 'sine', 0.08, 0.13, 0.9); }
      playTap()   { this._arp([440], 'sine', 0, 0.04, 0.045); }
    }
    const sound = new GhibliSound();

    // ---------- 2. 資料 ----------
    const KEY_TARGETS = 'komo_ghibli_tora_targets';
    const KEY_LOGS = 'komo_ghibli_tora_logs';
    const KEY_UI = 'komo_ghibli_tora_ui';

    const DEFAULT_TARGETS = [
      { id: 't-1', title: '買房頭期款 500 萬', type: 'savings', targetAmount: 5000000, currentAmount: 1850000 },
      { id: 't-2', title: '結清就學貸款', type: 'debt', targetAmount: 400000, currentAmount: 220000 },
      { id: 't-3', title: '日本自由行基金', type: 'savings', targetAmount: 120000, currentAmount: 84000 }
    ];
    const DEFAULT_LOGS = [
      { id: 1, targetId: 't-2', targetTitle: '結清就學貸款', type: 'debt', amount: 20000, note: '5月份就學貸款扣繳', date: '5月12日' },
      { id: 2, targetId: 't-1', targetTitle: '買房頭期款 500 萬', type: 'savings', amount: 40000, note: '發薪日固定存入頭期款', date: '5月5日' },
      { id: 3, targetId: 't-3', targetTitle: '日本自由行基金', type: 'savings', amount: 12000, note: '專案結案獎金存入', date: '4月26日' }
    ];

    const SPIRIT_QUOTES = [
      '小狸熊說：腳步正變得踏實又輕快，今天也做得很好！',
      '小狸熊說：每一筆小小的存蓄，都是森林裡正在萌芽的橡實',
      '小狸熊揉了揉小葉子：負擔像蒲公英一樣飄散了，整個人變好輕盈！',
      '小狸熊說：不慌不忙，心願袋裡的微光正一天天變得更加明亮',
      '小狸熊伸了個懶腰：慢慢來也沒關係，森林會等你的'
    ];

    const ui = store(KEY_UI, {});
    let state = {
      targets: store(KEY_TARGETS, DEFAULT_TARGETS),
      logs: store(KEY_LOGS, DEFAULT_LOGS),
      activeTargetIndex: Math.min(Number(ui.active) || 0, 2),
      historyFilter: 'all'
    };
    if (!Array.isArray(state.targets) || state.targets.length === 0) state.targets = DEFAULT_TARGETS;
    if (!Array.isArray(state.logs)) state.logs = [];
    if (state.activeTargetIndex >= state.targets.length) state.activeTargetIndex = 0;
    sound.muted = !!ui.muted;

    function saveState() {
      persist(KEY_TARGETS, state.targets);
      persist(KEY_LOGS, state.logs);
      persist(KEY_UI, { active: state.activeTargetIndex, muted: sound.muted });
    }

    // 進度計算集中一處：負債用 floor，避免「還剩 1,600 卻顯示 100%」
    function progressOf(t) {
      const goal = Number(t.targetAmount) || 0;
      const cur = Number(t.currentAmount) || 0;
      const raw = goal > 0 ? (cur / goal) * 100 : 0;
      const percent = Math.min(100, Math.floor(raw));
      return { goal, cur, gap: Math.max(0, goal - cur), percent, done: goal > 0 && cur >= goal };
    }
    function targetById(id) { return state.targets.find(t => t.id === id); }
    function logTitle(log) { return targetById(log.targetId)?.title ?? log.targetTitle ?? '已移除的心願'; }

    function logDateLabel(log) {
      if (!log.ts) return log.date || '';
      const d = new Date(log.ts);
      const sameYear = d.getFullYear() === new Date().getFullYear();
      return `${sameYear ? '' : d.getFullYear() + '年'}${d.getMonth() + 1}月${d.getDate()}日`;
    }

    // ---------- 3. 手繪水彩錢袋 ----------
    // 設計：同一個亞麻小布袋，存錢＝暖陽蜂蜜色從袋底慢慢「暈」上來；
    // 還款＝袋裡的灰藍霧氣慢慢沉下去，蒲公英絨毛從袋口飄走。
    // 水位沒有硬邊，上緣以 16 單位漸層暈開，並緩緩晃動。
    const BAG_BODY = 'M38,41 C24,49 16,65 19,85 C22,103 40,112 61,111 C82,110 99,101 101,83 C103,63 95,48 82,41 Z';
    const BAG_TOP = 111, BAG_RANGE = 72;          // 袋內可填高度（y 由 111 往上到 39）
    const lastPct = {};                             // 記住每個袋子上次的進度，用來做水位上升/下降動畫

    function levelY(fillRatio) {                    // 回傳液面群組要平移到的 y
      const r = Math.min(1, Math.max(0, fillRatio));
      return BAG_TOP - r * BAG_RANGE - 10;          // -10：讓暈開的上緣剛好落在液面
    }

    function renderBag(type, percent) {
      const isDebt = type === 'debt';
      const p = Math.min(100, Math.max(0, percent));
      const ink = '#6B4E3A';                        // 暖栗色墨線，取代原本的近黑色
      const pal = isDebt
        ? { a: '#7F93A3', b: '#A9B8C2', glow: '#DCE5EA', bead: '#C86A4B', cloth: '#F6F3EC' }
        : { a: '#E09A3E', b: '#F2C46A', glow: '#FFF1C9', bead: '#E6A63E', cloth: '#FBF6EA' };

      // 存錢：已存比例往上；還款：剩餘負債比例（隨還款下降）
      const fill = isDebt ? (100 - p) / 100 : p / 100;

      // 袋內小光點（存錢）
      const motes = !isDebt ? [[44, 22, 0], [70, 30, 1.3], [57, 40, 2.4], [80, 18, 3.1]]
        .slice(0, p >= 75 ? 4 : p >= 45 ? 3 : p >= 15 ? 2 : p > 0 ? 1 : 0)
        .map(([x, y, d]) => `<circle class="bag-mote" cx="${x}" cy="${y}" r="1.8" fill="#FFFBEA" style="animation-delay:${d}s"/>`).join('') : '';

      // 從袋口飄走的蒲公英絨毛（還款）
      const fluff = (x, y, d, s) => `
        <g transform="translate(${x},${y}) scale(${s})"><g class="bag-seed" style="animation-delay:${d}s">
          <path d="M0,0 L0,7" stroke="${ink}" stroke-width="0.9" stroke-linecap="round"/>
          ${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<path d="M0,0 L0,-4.5" stroke="#9AAF95" stroke-width="0.8" stroke-linecap="round" transform="rotate(${a})"/>`).join('')}
          <circle r="1.1" fill="${ink}"/>
        </g></g>`;
      const seeds = isDebt ? [[58, 26, 0, 1], [64, 24, 1.6, 0.85], [54, 25, 3.0, 0.75]]
        .slice(0, p >= 70 ? 3 : p >= 35 ? 2 : p >= 10 ? 1 : 0)
        .map(s => fluff(...s)).join('') : '';

      // 存錢袋口的小嫩芽：隨進度長大，100% 開一朵小花
      const sproutScale = (0.45 + Math.min(1, p / 100) * 0.55).toFixed(2);
      const sprout = !isDebt && p >= 10 ? `
        <g transform="translate(61,24) scale(${sproutScale})"><g class="bag-sprout">
          <path d="M0,0 C0,-5 0,-9 0,-13" stroke="#4E7A55" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M0,-8 C-3,-14 -11,-14 -11,-9 C-11,-5 -4,-5 0,-8 Z" fill="#7FA672" stroke="${ink}" stroke-width="1.1"/>
          <path d="M0,-11 C3,-17 11,-17 11,-12 C11,-8 4,-8 0,-11 Z" fill="#9DBF8C" stroke="${ink}" stroke-width="1.1"/>
          ${p >= 100 ? `<g transform="translate(0,-15)">${[0, 72, 144, 216, 288].map(a => `<ellipse rx="2" ry="3" cy="-2.6" fill="#FFD9E0" stroke="${ink}" stroke-width="0.6" transform="rotate(${a})"/>`).join('')}<circle r="1.6" fill="#E6A63E"/></g>` : ''}
        </g></g>` : '';

      // 結清負債時的小星光
      const cleared = isDebt && p >= 100 ? `<g class="bag-twinkle"><path d="M60,72 L62,79 L69,81 L62,83 L60,90 L58,83 L51,81 L58,79 Z" fill="#F2C46A" stroke="${ink}" stroke-width="0.8"/></g>` : '';

      return `
        <svg viewBox="0 0 120 120" class="w-full h-full select-none overflow-visible" aria-hidden="true">
          <defs>
            <clipPath id="bagClip"><path d="${BAG_BODY}"/></clipPath>
            <!-- 手繪抖動墨線 -->
            <filter id="inkWobble" x="-5%" y="-5%" width="110%" height="110%">
              <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <!-- 水彩暈染：邊緣不規則＋微微模糊 -->
            <filter id="watercolor" x="-10%" y="-10%" width="120%" height="120%">
              <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="3" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="d"/>
              <feGaussianBlur in="d" stdDeviation="1.1"/>
            </filter>
            <!-- 水位上緣柔和暈開（物件座標：上 0%→透明，約 16 單位後到飽和） -->
            <linearGradient id="levelGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${pal.glow}" stop-opacity="0"/>
              <stop offset="0.10" stop-color="${pal.glow}" stop-opacity="0.75"/>
              <stop offset="0.24" stop-color="${pal.b}" stop-opacity="0.9"/>
              <stop offset="0.75" stop-color="${pal.a}" stop-opacity="0.95"/>
              <stop offset="1" stop-color="${pal.a}"/>
            </linearGradient>
            <radialGradient id="clothShade" cx="0.38" cy="0.35" r="0.75">
              <stop offset="0" stop-color="#FFFFFF"/>
              <stop offset="0.7" stop-color="${pal.cloth}"/>
              <stop offset="1" stop-color="#E9DCC6"/>
            </radialGradient>
          </defs>

          <!-- 地面柔影 -->
          <ellipse cx="61" cy="113" rx="30" ry="4" fill="#B79C7E" opacity="0.28" style="filter: blur(1.5px)"/>

          <g class="bag-sway">
            <!-- 布袋本體（暖紙色＋柔光） -->
            <path d="${BAG_BODY}" fill="url(#clothShade)"/>

            <!-- 袋內水彩液面 -->
            <g clip-path="url(#bagClip)">
              <g class="bag-level" data-to="${levelY(fill).toFixed(1)}">
                <g filter="url(#watercolor)">
                  <path class="bag-wave-a" d="M-20,6 C0,0 20,10 40,5 C60,0 80,10 100,5 C120,0 140,10 160,5 L160,140 L-20,140 Z" fill="url(#levelGrad)"/>
                  <path class="bag-wave-b" d="M-30,10 C-10,5 10,13 30,9 C50,5 70,13 90,9 C110,5 130,13 150,9 L150,140 L-30,140 Z" fill="${pal.a}" opacity="0.28"/>
                </g>
                ${motes}
              </g>
            </g>

            <!-- 柔光高光（像布料被陽光照到） -->
            <ellipse cx="42" cy="66" rx="7" ry="13" fill="#FFFFFF" opacity="0.35" transform="rotate(18 42 66)" style="filter: blur(2px)"/>

            <!-- 手繪線稿（套用抖動濾鏡） -->
            <g filter="url(#inkWobble)" fill="none" stroke="${ink}" stroke-linecap="round" stroke-linejoin="round">
              <path d="${BAG_BODY}" stroke-width="2.3"/>
              <!-- 荷葉袋口 -->
              <path d="M40,42 C33,32 37,21 46,25 C50,16 58,15 62,22 C67,15 76,16 79,25 C87,21 91,32 82,42" fill="${pal.cloth}" stroke-width="2.1"/>
              <path d="M50,26 C51,31 51,35 50,39 M69,25 C69,30 70,35 71,39" stroke-width="1" opacity="0.45"/>
              <!-- 縫線 -->
              <path d="M30,92 C42,103 78,104 91,92" stroke="#B89A7C" stroke-width="1.3" stroke-dasharray="2.5 3"/>
              <path d="M27,58 C23,68 23,78 26,86" stroke="#B89A7C" stroke-width="1.1" stroke-dasharray="2.5 3" opacity="0.8"/>
              <!-- 束口繩 -->
              <path d="M37,42 C48,47 72,47 84,41" stroke-width="2.6"/>
              <path d="M58,45 C54,50 50,55 49,62" stroke-width="1.8"/>
              <path d="M63,45 C67,51 70,56 72,63" stroke-width="1.8"/>
            </g>
            <!-- 繩結木珠 -->
            <circle cx="49" cy="64" r="2.6" fill="${pal.bead}" stroke="${ink}" stroke-width="1.1"/>
            <circle cx="72" cy="65" r="2.6" fill="${pal.bead}" stroke="${ink}" stroke-width="1.1"/>
            <circle cx="60.5" cy="45.5" r="3.4" fill="${pal.bead}" stroke="${ink}" stroke-width="1.3"/>
            <circle cx="59.5" cy="44.5" r="1" fill="#FFFFFF" opacity="0.7"/>

            <!-- 小補丁：存錢是小太陽、負債是小葉子 -->
            <g transform="translate(78,86)" opacity="0.95">
              ${isDebt
                ? `<path d="M-5,4 C-6,-3 0,-7 6,-6 C6,0 2,5 -5,4 Z" fill="#CFE0C6" stroke="${ink}" stroke-width="1"/><path d="M-4,3 L4,-4" stroke="${ink}" stroke-width="0.7"/>`
                : `<circle r="5" fill="#FBE3A8" stroke="${ink}" stroke-width="1"/><circle r="7.5" fill="none" stroke="#B89A7C" stroke-width="0.8" stroke-dasharray="1.5 2"/>`}
            </g>

            ${cleared}
            ${sprout}
          </g>

          ${seeds}
        </svg>`;
    }

    // 錢袋插入後，讓液面從上次位置平滑移動到新位置
    function animateBagLevel(container, targetId, percent, isDebt) {
      const level = container.querySelector('.bag-level');
      if (!level) return;
      const from = lastPct[targetId] ?? 0;          // 第一次看到這個袋子：從空袋慢慢注入
      const fromY = levelY(isDebt ? (100 - from) / 100 : from / 100);
      const toY = Number(level.dataset.to);
      lastPct[targetId] = percent;
      level.style.transition = 'none';
      level.style.transform = `translateY(${fromY}px)`;
      if (from === percent || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        level.style.transform = `translateY(${toY}px)`;
        return;
      }
      requestAnimationFrame(() => requestAnimationFrame(() => {
        level.style.transition = 'transform 1.6s cubic-bezier(0.22, 1, 0.36, 1)';
        level.style.transform = `translateY(${toY}px)`;
      }));
    }

    function bounceBag() {
      const wrap = document.querySelector('#pouchCard .bag-wrap');
      if (!wrap) return;
      wrap.classList.remove('bag-bounce');
      void wrap.offsetWidth;
      wrap.classList.add('bag-bounce');
    }

    // ---------- 4. 渲染 ----------
    function renderAll() {
      renderOverview();
      renderTabs();
      renderCurrentCard();
      renderMiniLogs();
    }

    function renderOverview() {
      let totalSaved = 0, totalDebt = 0;
      state.targets.forEach(t => {
        const { cur, gap } = progressOf(t);
        if (t.type === 'savings') totalSaved += cur; else totalDebt += gap;
      });
      $('overviewTotalSaved').textContent = formatNumber(totalSaved);
      $('overviewTotalDebt').textContent = formatNumber(totalDebt);
    }

    function renderTabs() {
      const container = $('targetTabContainer');
      container.innerHTML = '';
      state.targets.forEach((t, idx) => {
        const isActive = idx === state.activeTargetIndex;
        const isDebt = t.type === 'debt';
        const { percent, done } = progressOf(t);
        const btn = document.createElement('button');
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-selected', String(isActive));
        btn.className = `flex-1 min-w-0 py-2 px-2.5 rounded-2xl border-2 text-center transition ghibli-tap ${
          isActive
            ? (isDebt ? 'bg-ghibli-terraSoft border-ghibli-terracotta font-extrabold text-ghibli-terracotta shadow-xs' : 'bg-ghibli-paleLeaf border-ghibli-moss font-extrabold text-ghibli-moss shadow-xs')
            : 'bg-white/85 border-ghibli-moss/20 text-ghibli-wood hover:bg-white'
        }`;
        // Tab 上直接看到每個心願的進度，不用逐一點開
        btn.innerHTML = `
          <div class="text-[10px] font-bold ${isActive ? (isDebt ? 'text-ghibli-terracotta' : 'text-ghibli-moss') : 'text-ghibli-wood/70'}">
            ${isDebt ? '結清負債' : '存錢目標'} · ${done ? '完成' : percent + '%'}
          </div>
          <div class="text-xs truncate w-full mt-0.5 font-bold font-round">${escapeHtml(t.title)}</div>`;
        btn.addEventListener('click', () => {
          if (state.activeTargetIndex === idx) return;
          sound.playTap();
          state.activeTargetIndex = idx;
          saveState();
          renderAll();
        });
        container.appendChild(btn);
      });
    }

    function renderCurrentCard() {
      const current = state.targets[state.activeTargetIndex];
      if (!current) return;
      const card = $('pouchCard');
      const actionBtn = $('mainActionBtn');
      const isDebt = current.type === 'debt';
      const { goal, cur, gap, percent, done } = progressOf(current);

      const baseBtn = 'flex-1 py-3.5 px-4 rounded-2xl font-black font-round text-white shadow-lg flex items-center justify-center gap-2 ghibli-tap transition-all ';
      actionBtn.className = baseBtn + (isDebt ? 'bg-ghibli-terracotta hover:opacity-95' : 'bg-ghibli-moss hover:bg-ghibli-moss/90');
      $('mainActionText').textContent = isDebt ? (done ? '已全部結清' : '記一筆還款') : '記一筆存錢';
      actionBtn.disabled = isDebt && done;   // 已結清的負債不能再記還款，避免已還金額超過原本負債

      const rows = isDebt
        ? [['原本負債', goal, ''], ['已還金額', cur, 'terracotta'], ['還剩負債', gap, 'total']]
        : [['目標金額', goal, ''], ['目前已存', cur, 'moss'], ['還差金額', gap, 'total']];

      const detailHtml = `
        <div class="space-y-1.5">
          ${rows.map(([label, val, kind]) => kind === 'total' ? `
            <div class="pt-1.5 border-t border-ghibli-wood/10 flex items-baseline justify-between gap-2">
              <span class="text-xs text-ghibli-woodDark font-black whitespace-nowrap">${label}</span>
              <span class="text-base font-black font-round text-ghibli-woodDark truncate">NT$ ${formatNumber(val)}</span>
            </div>` : `
            <div class="flex items-baseline justify-between gap-2">
              <span class="text-xs font-bold whitespace-nowrap ${kind ? 'text-ghibli-' + kind : 'text-ghibli-wood'}">${label}</span>
              <span class="text-xs font-bold truncate ${kind ? 'font-extrabold text-ghibli-' + kind : 'text-ghibli-woodDark'}">NT$ ${formatNumber(val)}</span>
            </div>`).join('')}
        </div>`;

      const msg = isDebt
        ? (done ? '恭喜結清！整個袋子徹底明亮輕透！' : '每還一次款，負擔就像蒲公英羽毛輕輕飄走')
        : (done ? '恭喜圓滿！心願袋已經盛滿金色晨光！' : '像森林裡的樹木，正在溫暖陽光下穩穩累積');

      card.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <span class="flex-shrink-0 text-[11px] font-extrabold px-2.5 py-0.5 rounded-full ${isDebt ? 'bg-ghibli-terraSoft text-ghibli-terracotta' : 'bg-ghibli-paleLeaf text-ghibli-moss'}">
              ${isDebt ? '結清負債' : '存錢目標'}
            </span>
            <h2 class="text-base font-extrabold font-round text-ghibli-woodDark truncate">${escapeHtml(current.title)}</h2>
          </div>
          <span class="flex-shrink-0 text-xs font-black font-round ${isDebt ? 'text-ghibli-terracotta' : 'text-ghibli-moss'}">
            ${isDebt ? '已減輕 ' : '已累積 '}${percent}%
          </span>
        </div>
        <div class="my-4 flex items-center gap-4">
          <div class="bag-wrap w-32 h-32 flex-shrink-0">${renderBag(current.type, percent)}</div>
          <div class="flex-1 min-w-0">${detailHtml}</div>
        </div>
        <div class="w-full">
          <div class="w-full h-3 bg-ghibli-paleLeaf rounded-full overflow-hidden p-0.5 border border-ghibli-moss/20" role="progressbar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100">
            <div class="h-full rounded-full transition-all duration-700 ease-out" style="width: ${percent === 0 ? 0 : Math.max(4, percent)}%; background: ${isDebt ? 'linear-gradient(90deg, #EBC2AE, #C86A4B)' : 'linear-gradient(90deg, #F2D58A, #E6A63E 55%, #5B8266)'}; box-shadow: 0 0 6px ${isDebt ? 'rgba(200,106,75,.35)' : 'rgba(230,166,62,.4)'}"></div>
          </div>
          <p class="text-[11px] text-ghibli-wood text-right mt-1.5 font-bold">${msg}</p>
        </div>`;
      animateBagLevel(card, current.id, percent, isDebt);
    }

    function logRowHtml(item, { compact }) {
      const isDebt = item.type === 'debt';
      const tag = `<span class="flex-shrink-0 text-[9px] px-1.5 py-px rounded font-extrabold ${isDebt ? 'bg-ghibli-terraSoft text-ghibli-terracotta' : 'bg-white text-ghibli-moss'}">${isDebt ? '還款' : '存錢'}</span>`;
      const amount = `<span class="flex-shrink-0 font-extrabold font-round ${compact ? '' : 'text-sm'} ${isDebt ? 'text-ghibli-terracotta' : 'text-ghibli-moss'}">${isDebt ? '-' : '+'}NT$ ${formatNumber(item.amount)}</span>`;
      if (compact) {
        return `
          <div class="flex items-center gap-2 min-w-0">
            ${tag}
            <span class="text-ghibli-woodDark font-bold truncate">${escapeHtml(item.note || logTitle(item))}</span>
            <span class="flex-shrink-0 text-[10px] text-ghibli-wood">${escapeHtml(logDateLabel(item))}</span>
          </div>${amount}`;
      }
      return `
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 min-w-0">${tag}<span class="text-xs font-bold text-ghibli-woodDark truncate">${escapeHtml(logTitle(item))}</span></div>
          <div class="text-[11px] text-ghibli-wood mt-0.5 truncate">${escapeHtml(item.note)}</div>
          <div class="text-[10px] text-ghibli-wood/70 mt-0.5">${escapeHtml(logDateLabel(item))}</div>
        </div>
        <div class="flex flex-col items-end gap-1 flex-shrink-0">
          ${amount}
          <button class="del-btn text-[10px] font-bold text-ghibli-wood/60 hover:text-ghibli-terracotta px-1.5 py-0.5 rounded-md" data-id="${item.id}">刪除</button>
        </div>`;
    }

    // 便簽只顯示「目前這個心願袋」的最近 3 筆，和上方卡片的焦點一致
    function renderMiniLogs() {
      const container = $('recentLogsContainer');
      const current = state.targets[state.activeTargetIndex];
      const logs = state.logs.filter(l => l.targetId === current?.id).slice(0, 3);
      container.innerHTML = '';
      if (logs.length === 0) {
        container.innerHTML = `<div class="text-ghibli-wood text-center py-2 font-medium">這個心願袋還沒有足跡，記下第一筆吧</div>`;
        return;
      }
      logs.forEach(item => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between gap-2 py-1 border-b border-ghibli-moss/10 last:border-0';
        row.innerHTML = logRowHtml(item, { compact: true });
        container.appendChild(row);
      });
    }

    // ---------- 5. 抽屜控制（點背景 / Esc 皆可關閉） ----------
    let openSheetId = null;
    function openSheet(sheetId) {
      sound.playTap();
      const sheet = $(sheetId);
      sheet.classList.remove('opacity-0', 'pointer-events-none');
      sheet.querySelector('.sheet-body').classList.remove('translate-y-full');
      openSheetId = sheetId;
    }
    function closeSheet(sheetId = openSheetId) {
      if (!sheetId) return;
      const sheet = $(sheetId);
      sheet.classList.add('opacity-0', 'pointer-events-none');
      sheet.querySelector('.sheet-body').classList.add('translate-y-full');
      if (document.activeElement) document.activeElement.blur();
      openSheetId = null;
    }
    document.querySelectorAll('.sheet').forEach(sheet => {
      sheet.addEventListener('click', (e) => { if (e.target === sheet) { sound.playTap(); closeSheet(sheet.id); } });
      sheet.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { sound.playTap(); closeSheet(sheet.id); }));
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && openSheetId) closeSheet(); });

    // ---------- 6. 記一筆 ----------
    const amountInput = $('inputAmount');

    function currentAmountValue() { return parseAmount(amountInput.value); }

    function setAmount(n) {
      amountInput.value = n > 0 ? formatNumber(n) : '';
      updateRecordPreview();
    }

    function updateRecordPreview() {
      const current = state.targets[state.activeTargetIndex];
      const amt = currentAmountValue();
      const preview = $('recordPreview');
      const submit = $('recordSubmitBtn');
      const { goal, cur, gap } = progressOf(current);
      const isDebt = current.type === 'debt';

      if (!amt) {
        preview.className = 'mt-2.5 text-[11px] font-bold text-ghibli-wood/70 min-h-[16px]';
        preview.textContent = isDebt ? `目前還剩 NT$ ${formatNumber(gap)}` : `目前已存 NT$ ${formatNumber(cur)}，還差 NT$ ${formatNumber(gap)}`;
        submit.disabled = true;
        return;
      }
      if (isDebt && amt > gap) {
        preview.className = 'mt-2.5 text-[11px] font-bold text-ghibli-terracotta min-h-[16px]';
        preview.textContent = `超過還剩負債 NT$ ${formatNumber(gap)}，請確認金額`;
        submit.disabled = true;
        return;
      }
      const after = cur + amt;
      const pct = goal > 0 ? Math.min(100, Math.floor((after / goal) * 100)) : 0;
      preview.className = `mt-2.5 text-[11px] font-bold min-h-[16px] ${isDebt ? 'text-ghibli-terracotta' : 'text-ghibli-moss'}`;
      preview.textContent = isDebt
        ? `記下後 → 還剩 NT$ ${formatNumber(Math.max(0, goal - after))}（已減輕 ${pct}%）`
        : `記下後 → 已存 NT$ ${formatNumber(after)}（達成 ${pct}%）`;
      submit.disabled = false;
    }

    $('mainActionBtn').addEventListener('click', () => {
      const current = state.targets[state.activeTargetIndex];
      const isDebt = current.type === 'debt';
      $('recordTitle').textContent = isDebt ? '記一筆還款' : '記一筆存錢';
      $('recordSub').textContent = `目標：${current.title}`;
      $('recordSubmitBtn').textContent = isDebt ? '確認還款' : '確認存入';
      $('recordSubmitBtn').className = `w-full py-3.5 rounded-2xl text-white font-extrabold font-round text-sm tracking-wide shadow-md ghibli-tap ${isDebt ? 'bg-ghibli-terracotta hover:opacity-95' : 'bg-ghibli-moss hover:bg-ghibli-moss/90'}`;
      $('inputNote').placeholder = isDebt ? '例如：本月分期還款' : '例如：每月固定薪水存入';
      amountInput.value = '';
      $('inputNote').value = '';
      updateRecordPreview();
      openSheet('sheetRecord');
      amountInput.focus({ preventScroll: true }); // 打開就能直接輸入
    });

    // 輸入時即時加上千分位，大金額不易看錯位數
    amountInput.addEventListener('input', () => {
      const n = parseAmount(amountInput.value);
      amountInput.value = n > 0 ? formatNumber(Math.min(n, 999999999)) : '';
      updateRecordPreview();
    });

    // 快捷金額：累加（和按鈕上的「+」一致）
    document.querySelectorAll('.btn-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        sound.playTap();
        setAmount(currentAmountValue() + Number(btn.dataset.val));
      });
    });
    $('clearAmountBtn').addEventListener('click', () => { setAmount(0); amountInput.focus({ preventScroll: true }); });

    $('recordForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if ($('recordSubmitBtn').disabled) return;
      const amt = currentAmountValue();
      const current = state.targets[state.activeTargetIndex];
      if (!amt || !current) return;

      const wasDone = progressOf(current).done;
      current.currentAmount = Number(current.currentAmount) + amt;
      const nowDone = progressOf(current).done;
      const isDebt = current.type === 'debt';

      const now = new Date();
      const log = {
        id: Date.now(),
        ts: now.getTime(),
        targetId: current.id,
        targetTitle: current.title,
        type: current.type,
        amount: amt,
        note: $('inputNote').value.trim() || (isDebt ? '手動記錄還款' : '手動記錄存錢'),
        date: `${now.getMonth() + 1}月${now.getDate()}日`
      };
      state.logs.unshift(log);

      saveState();
      renderAll();
      closeSheet('sheetRecord');

      if (!wasDone && nowDone) sound.playGoal(); else if (isDebt) sound.playRepay(); else sound.playSave();
      hopMascot();
      bounceBag();
      $('spiritQuote').textContent = SPIRIT_QUOTES[Math.floor(Math.random() * SPIRIT_QUOTES.length)];

      const text = (!wasDone && nowDone)
        ? (isDebt ? '結清了！小狸熊開心得轉圈圈！' : '心願達成！金色晨光滿出來了！')
        : (isDebt ? `負債減輕 NT$ ${formatNumber(amt)}` : `+NT$ ${formatNumber(amt)}，晨光又多了一點`);
      showToast(text, { undo: () => deleteLog(log.id, { silent: true }) });
    });

    // ---------- 7. 刪除 / 復原 ----------
    function deleteLog(id, { silent } = {}) {
      const idx = state.logs.findIndex(l => String(l.id) === String(id));
      if (idx < 0) return;
      const log = state.logs[idx];
      const t = targetById(log.targetId);
      if (t) t.currentAmount = Math.max(0, Number(t.currentAmount) - Number(log.amount));
      state.logs.splice(idx, 1);
      saveState();
      renderAll();
      if (openSheetId === 'sheetHistory') renderFullHistory();
      showToast(silent ? '已復原，就當沒發生過' : `已刪除，${t ? '金額已扣回' : '紀錄已移除'}`);
    }

    // ---------- Toast ----------
    let toastTimer = null;
    function showToast(msg, { undo } = {}) {
      const toast = $('toast');
      const undoBtn = $('toastUndoBtn');
      const dur = undo ? 5000 : 2600;
      clearTimeout(toastTimer);
      $('toastMsg').textContent = msg;
      undoBtn.classList.toggle('hidden', !undo);
      undoBtn.onclick = undo ? () => { sound.playTap(); clearTimeout(toastTimer); toast.classList.add('hidden'); toast.classList.remove('flex'); undo(); } : null;

      toast.classList.remove('hidden', 'toast-float');
      toast.classList.add('flex');
      toast.style.setProperty('--toast-dur', dur + 'ms');
      void toast.offsetWidth; // 重新觸發動畫
      toast.classList.add('toast-float');
      toastTimer = setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('flex'); }, dur);
    }

    function hopMascot() {
      const box = $('mascotBtn');
      box.classList.remove('mascot-hop');
      void box.offsetWidth;
      box.classList.add('mascot-hop');
    }
    $('mascotBtn').addEventListener('click', () => {
      sound.playTap();
      hopMascot();
      const q = $('spiritQuote');
      let next;
      do { next = SPIRIT_QUOTES[Math.floor(Math.random() * SPIRIT_QUOTES.length)]; } while (next === q.textContent && SPIRIT_QUOTES.length > 1);
      q.textContent = next;
    });

    // ---------- 8. 設定目標 ----------
    $('openEditBtn').addEventListener('click', () => {
      renderEditCards();
      $('editError').classList.add('hidden');
      openSheet('sheetEdit');
    });

    function editLabels(isDebt) {
      return isDebt ? ['原本負債總額', '已還款金額'] : ['目標金額', '目前已存'];
    }

    function renderEditCards() {
      const container = $('editCardsList');
      container.innerHTML = '';
      state.targets.forEach((t, i) => {
        const isDebt = t.type === 'debt';
        const [l1, l2] = editLabels(isDebt);
        const card = document.createElement('div');
        card.className = 'p-4 rounded-2xl bg-ghibli-paleLeaf/60 border-2 border-ghibli-moss/20 space-y-3';
        card.innerHTML = `
          <div class="flex items-center justify-between pb-1 border-b border-ghibli-moss/15">
            <span class="text-xs font-black text-ghibli-woodDark font-round">心願袋 0${i + 1}</span>
            <select id="edit-type-${i}" class="font-bold rounded-xl border border-ghibli-moss/30 px-2 py-1 bg-white text-ghibli-woodDark" style="font-size:13px !important">
              <option value="savings" ${!isDebt ? 'selected' : ''}>存錢目標</option>
              <option value="debt" ${isDebt ? 'selected' : ''}>結清負債</option>
            </select>
          </div>
          <div>
            <label for="edit-title-${i}" class="block text-[11px] font-bold text-ghibli-wood mb-1">目標名稱</label>
            <input type="text" id="edit-title-${i}" value="${escapeHtml(t.title)}" maxlength="18"
              class="w-full px-3 py-1.5 rounded-xl border border-ghibli-moss/30 font-bold text-ghibli-woodDark bg-white">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label id="edit-l1-${i}" for="edit-target-${i}" class="block text-[11px] font-bold text-ghibli-wood mb-1">${l1}</label>
              <input type="text" inputmode="numeric" id="edit-target-${i}" value="${formatNumber(t.targetAmount)}"
                class="edit-num w-full px-2.5 py-1.5 rounded-xl border border-ghibli-moss/30 text-ghibli-woodDark bg-white font-bold">
            </div>
            <div>
              <label id="edit-l2-${i}" for="edit-curr-${i}" class="block text-[11px] font-bold text-ghibli-wood mb-1">${l2}</label>
              <input type="text" inputmode="numeric" id="edit-curr-${i}" value="${formatNumber(t.currentAmount)}"
                class="edit-num w-full px-2.5 py-1.5 rounded-xl border border-ghibli-moss/30 text-ghibli-woodDark bg-white font-bold">
            </div>
          </div>`;
        container.appendChild(card);

        // 切換類型時，欄位名稱同步改變
        card.querySelector(`#edit-type-${i}`).addEventListener('change', (e) => {
          const [a, b] = editLabels(e.target.value === 'debt');
          $(`edit-l1-${i}`).textContent = a;
          $(`edit-l2-${i}`).textContent = b;
        });
      });
      container.querySelectorAll('.edit-num').forEach(inp => inp.addEventListener('input', () => {
        const n = parseAmount(inp.value);
        inp.value = inp.value.trim() === '' ? '' : formatNumber(n);
      }));
    }

    $('saveEditTargetsBtn').addEventListener('click', () => {
      const errorEl = $('editError');
      const next = [];
      for (let i = 0; i < state.targets.length; i++) {
        const title = $(`edit-title-${i}`).value.trim();
        const type = $(`edit-type-${i}`).value;
        const goal = parseAmount($(`edit-target-${i}`).value);
        const cur = parseAmount($(`edit-curr-${i}`).value);
        if (!title) { errorEl.textContent = `心願袋 0${i + 1} 的名稱不能空白`; errorEl.classList.remove('hidden'); return; }
        const curRaw = $(`edit-curr-${i}`).value.trim();
        const fail = (m) => { errorEl.textContent = `心願袋 0${i + 1}：${m}`; errorEl.classList.remove('hidden'); };
        if (!goal) return fail(type === 'debt' ? '原本負債總額需大於 0' : '目標金額需大於 0');
        if (curRaw === '') return fail(type === 'debt' ? '請填入已還款金額（沒有就填 0）' : '請填入目前已存（沒有就填 0）');
        if (type === 'debt' && cur > goal) return fail('已還款金額不能大於原本負債總額');
        next.push({ title, type, targetAmount: goal, currentAmount: cur });
      }
      sound.playTap();
      state.targets.forEach((t, i) => Object.assign(t, next[i]));
      saveState();
      renderAll();
      closeSheet('sheetEdit');
      showToast('心願目標已更新');
    });

    // ---------- 9. 全部足跡 ----------
    $('viewHistoryBtn').addEventListener('click', () => {
      state.historyFilter = 'current';
      renderFullHistory();
      openSheet('sheetHistory');
    });

    function renderHistoryFilter() {
      const current = state.targets[state.activeTargetIndex];
      const opts = [['current', current ? current.title : '目前'], ['all', '全部心願']];
      const wrap = $('historyFilter');
      wrap.innerHTML = '';
      opts.forEach(([val, label]) => {
        const b = document.createElement('button');
        const on = state.historyFilter === val;
        b.className = `max-w-[60%] truncate px-3 py-1 rounded-full border ghibli-tap ${on ? 'bg-ghibli-moss text-white border-ghibli-moss' : 'bg-white text-ghibli-wood border-ghibli-moss/30'}`;
        b.textContent = label;
        b.addEventListener('click', () => { sound.playTap(); state.historyFilter = val; renderFullHistory(); });
        wrap.appendChild(b);
      });
    }

    function renderFullHistory() {
      renderHistoryFilter();
      const container = $('fullHistoryContainer');
      const current = state.targets[state.activeTargetIndex];
      const logs = state.historyFilter === 'current' ? state.logs.filter(l => l.targetId === current?.id) : state.logs;
      container.innerHTML = '';
      if (logs.length === 0) {
        container.innerHTML = `<div class="text-ghibli-wood text-center py-6 font-bold">尚無任何記帳紀錄</div>`;
        return;
      }
      logs.forEach(log => {
        const card = document.createElement('div');
        card.className = 'p-3 rounded-2xl bg-ghibli-paleLeaf/50 border border-ghibli-moss/20 flex items-center justify-between gap-3';
        card.innerHTML = logRowHtml(log, { compact: false });
        container.appendChild(card);
      });
    }

    // 刪除採「點兩下確認」，不跳系統對話框
    $('fullHistoryContainer').addEventListener('click', (e) => {
      const btn = e.target.closest('.del-btn');
      if (!btn) return;
      sound.playTap();
      if (btn.dataset.armed) { deleteLog(btn.dataset.id); return; }
      btn.dataset.armed = '1';
      btn.textContent = '確定刪除？';
      btn.classList.add('bg-ghibli-terraSoft', 'text-ghibli-terracotta');
      setTimeout(() => {
        if (!btn.isConnected) return;
        delete btn.dataset.armed;
        btn.textContent = '刪除';
        btn.classList.remove('bg-ghibli-terraSoft', 'text-ghibli-terracotta');
      }, 3000);
    });

    // ---------- 10. 音效開關 ----------
    function renderSoundIcon() {
      $('soundIconOn').classList.toggle('hidden', sound.muted);
      $('soundIconOff').classList.toggle('hidden', !sound.muted);
      $('soundToggleBtn').setAttribute('aria-pressed', String(!sound.muted));
    }
    $('soundToggleBtn').addEventListener('click', () => {
      sound.muted = !sound.muted;
      renderSoundIcon();
      saveState();
      if (!sound.muted) sound.playSave();
    });

    // ---------- 11. 匯出 / 匯入備份 ----------
    function todayStamp(d = new Date()) {
      return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    }
    function renderLastBackup() {
      const t = store(KEY_UI, {}).lastBackup;
      $('lastBackupText').textContent = t ? `上次匯出：${new Date(t).getMonth() + 1}月${new Date(t).getDate()}日` : '尚未匯出過';
    }
    function markBackedUp() {
      const u = store(KEY_UI, {}); u.lastBackup = Date.now(); persist(KEY_UI, u);
      renderLastBackup();
      showToast('備份檔已匯出，收好它喔');
    }

    $('exportBtn').addEventListener('click', async () => {
      sound.playTap();
      const data = { app: 'komorebi-pocket', version: 1, exportedAt: new Date().toISOString(), targets: state.targets, logs: state.logs };
      const json = JSON.stringify(data, null, 2);
      const name = `口袋之森備份-${todayStamp()}.json`;
      const download = () => {
        const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        const a = Object.assign(document.createElement('a'), { href: url, download: name });
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        markBackedUp();
      };
      // 手機上優先用系統分享面板（可直接存到「檔案」、LINE、雲端硬碟）
      try {
        const file = new File([json], name, { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: '口袋之森備份' });
          markBackedUp();
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return;   // 使用者自己取消
      }
      download();
    });

    function sanitizeBackup(raw) {
      if (!raw || typeof raw !== 'object') throw new Error('檔案格式不對');
      if (!Array.isArray(raw.targets) || raw.targets.length < 1 || raw.targets.length > 3) throw new Error('找不到心願袋資料');
      const targets = raw.targets.map((t, i) => {
        const goal = Math.floor(Number(t.targetAmount)), cur = Math.floor(Number(t.currentAmount));
        if (!(goal > 0) || !(cur >= 0)) throw new Error(`第 ${i + 1} 個心願袋金額有誤`);
        return {
          id: String(t.id || `t-${i + 1}`),
          title: String(t.title || `心願 ${i + 1}`).slice(0, 18),
          type: t.type === 'debt' ? 'debt' : 'savings',
          targetAmount: goal,
          currentAmount: cur
        };
      });
      const logs = (Array.isArray(raw.logs) ? raw.logs : [])
        .filter(l => l && Number(l.amount) > 0)
        .map(l => ({
          id: l.id ?? Date.now() + Math.random(),
          ts: Number(l.ts) || undefined,
          targetId: String(l.targetId ?? ''),
          targetTitle: String(l.targetTitle ?? ''),
          type: l.type === 'debt' ? 'debt' : 'savings',
          amount: Math.floor(Number(l.amount)),
          note: String(l.note ?? '').slice(0, 30),
          date: String(l.date ?? '')
        }));
      return { targets, logs, exportedAt: raw.exportedAt };
    }

    let pendingImport = null;
    $('importBtn').addEventListener('click', () => { sound.playTap(); $('importFile').value = ''; $('importFile').click(); });
    $('importFile').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        pendingImport = sanitizeBackup(JSON.parse(await file.text()));
        const when = pendingImport.exportedAt ? new Date(pendingImport.exportedAt) : null;
        $('importSummary').textContent =
          `這份備份${when && !isNaN(when) ? `（${when.getFullYear()}/${when.getMonth() + 1}/${when.getDate()} 匯出）` : ''}有 ${pendingImport.targets.length} 個心願袋、${pendingImport.logs.length} 筆足跡。` +
          `匯入後會取代目前手機上的資料。`;
        $('importConfirm').classList.remove('hidden');
      } catch (err) {
        pendingImport = null;
        showToast(`無法匯入：${err.message && /[\u4e00-\u9fff]/.test(err.message) ? err.message : '這不是口袋之森的備份檔'}`);
      }
    });
    $('importCancelBtn').addEventListener('click', () => { sound.playTap(); pendingImport = null; $('importConfirm').classList.add('hidden'); });
    $('importOkBtn').addEventListener('click', () => {
      if (!pendingImport) return;
      const previous = { targets: state.targets, logs: state.logs, active: state.activeTargetIndex };
      state.targets = pendingImport.targets;
      state.logs = pendingImport.logs;
      state.activeTargetIndex = 0;
      Object.keys(lastPct).forEach(k => delete lastPct[k]);
      pendingImport = null;
      $('importConfirm').classList.add('hidden');
      saveState();
      renderAll();
      closeSheet('sheetEdit');
      sound.playSave();
      showToast('備份已匯入', { undo: () => {
        state.targets = previous.targets; state.logs = previous.logs; state.activeTargetIndex = previous.active;
        saveState(); renderAll(); showToast('已還原成匯入前的資料');
      } });
    });
    $('openEditBtn').addEventListener('click', () => { renderLastBackup(); $('importConfirm').classList.add('hidden'); });

    // ---------- 12. 即時儲存的保險 ----------
    // 同時開兩個視窗時，另一邊的變更即時同步過來
    window.addEventListener('storage', (e) => {
      if (![KEY_TARGETS, KEY_LOGS].includes(e.key)) return;
      state.targets = store(KEY_TARGETS, state.targets);
      state.logs = store(KEY_LOGS, state.logs);
      if (state.activeTargetIndex >= state.targets.length) state.activeTargetIndex = 0;
      renderAll();
    });
    // App 被切到背景或關閉前，再存一次
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveState(); });
    window.addEventListener('pagehide', saveState);
    // 請瀏覽器把資料標記為「不要自動清除」
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    // 離線也能開啟（需透過 https 網址開啟才會啟用）
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }

    renderSoundIcon();
    renderAll();
  </script>
</body>
</html>
